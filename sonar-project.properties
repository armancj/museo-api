# SonarQube configuration for Museo API
sonar.projectKey=museo-api
sonar.projectName=Museo API
sonar.projectVersion=1.0.0

# Path to source directories
sonar.sources=src
sonar.tests=test

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Exclude patterns
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.spec.ts

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test coverage
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,test/**/*

# Duplication detection
sonar.cpd.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,test/**/*